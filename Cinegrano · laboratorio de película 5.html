<script>

const REA=(()=>{

const RNG={exposure:[-3,3],contrast:[-1,1],response:[0,1],print:[0,1],shadows:[-1,1],mids:[-1,1],highs:[-1,1],sat:[-1,1],temp:[-1,1],tint:[-1,1],grain:[0,1],gsize:[.3,4],grough:[0,1],gchroma:[0,1],hal:[0,1.5],hrad:[.003,.08],hth:[0,.95],bloom:[0,1.5],brad:[.003,.12],bth:[0,.95],fnd:[0,1],fexp:[-3,3],fng:[.5,1.6],fpg:[.5,1.6],fpe:[-2,2],fpr:[-.3,.3],fpgc:[-.3,.3],fpb:[-.3,.3],fanc:[.06,.4],fhl:[0,1],fxt:[0,2],fsat:[0,2],fgr:[0,3],fmm:[5,80],fgs:[.3,4],fgc:[0,1],fha:[0,3],fhrad:[.003,.08],fhth:[0,.95],fhR:[0,1],fhG:[0,1],fhB:[0,1],fba:[0,3],fbrad:[.003,.12],fbth:[0,.95],fbR:[0,1],fbG:[0,1],fbB:[0,1]};
function norm(p){const o={};const ENUM={profile:Object.keys(PROFILES),mode:['generic','film'],view:['full','base','grain','hal','bloom'],dataset:['legacy','kodak']},old=p&&typeof p==='object'&&p.ver!==3&&p.dataset===undefined;for(const k in DEF){let v=p&&p[k];if(k==='ver'){o[k]=3;continue}if(k==='dataset'&&old){o[k]='legacy';continue}if(ENUM[k]){o[k]=ENUM[k].includes(v)?v:DEF[k];continue}v=(v==null||v==='')?NaN:Number(v);if(!isFinite(v))v=DEF[k];o[k]=Math.min(RNG[k][1],Math.max(RNG[k][0],v))}return o}

/* [EXPERIMENTAL pow-lut] 10^-u por tabla con interpolación lineal (paso 1/4096); fuera de [-1,6) usa Math.pow */
const PW_LO=-1,PW_HI=6,PW_ST=4096,PW=(()=>{const t=new Float64Array((PW_HI-PW_LO)*PW_ST+2);for(let i=0;i<t.length;i++)t[i]=Math.pow(10,-(PW_LO+i/PW_ST));return t})();
const pw10=u=>{if(!(u>=PW_LO&&u<PW_HI))return Math.pow(10,-u);const f=(u-PW_LO)*PW_ST,k=f|0;return PW[k]+(PW[k+1]-PW[k])*(f-k)};

function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function passH(a,b,w,h,r){const d=2*r+1,w3=w*3;for(let y=0;y<h;y++){const o=y*w3;let s0=0,s1=0,s2=0;
for(let i=-r;i<=r;i++){const x=i<0?0:i>w-1?w-1:i,k=o+x*3;s0+=a[k];s1+=a[k+1];s2+=a[k+2]}

function process(src,w,h,params,seed,bits){
const p=norm(params);if(p.mode==='film')return film(src,w,h,p,seed,bits);const pr=PROFILES[p.profile],n=w*h,md=Math.min(w,h),lin=new Float32Array(n*3);
const gain=Math.pow(2,p.exposure),wr=1+.25*p.temp,wb=1-.25*p.temp,wg=1-.15*p.tint;
for(let i=0;i<n;i++){const j=i*4,k=i*3;lin[k]=S2L[src[j]]*gain*wr;lin[k+1]=S2L[src[j+1]]*gain*wg;lin[k+2]=S2L[src[j+2]]*gain*wb}
const glow=(amt,rad,th,tint)=>{if(amt<=0)return;const B=new Float32Array(n*3),d=Math.max(1e-3,1-th);
for(let i=0;i<n;i++){const k=i*3,L=.2126*lin[k]+.7152*lin[k+1]+.0722*lin[k+2],m=L>th?(L-th)/d:0;if(m>0)for(let c=0;c<3;c++)B[k+c]=tint?m*tint[c]:lin[k+c]*m}

glow(p.bloom,p.brad,p.bth,null);glow(p.hal*2,p.hrad,p.hth,[1,.22,.05]);
const k=p.response*2,a=Math.min(.9,pr.con*k),toe=pr.toe*k,knee=1-(1-pr.knee)*k,sat=Math.max(0,(1+p.sat)*(1+(pr.sat-1)*k)),q=p.print,cf=1+.8*p.contrast;
const M=pr.mix.map((v,i)=>(i%4===0?1:0)*(1-k)+v*k);
const sm=x=>x*x*(3-2*x),cl=x=>x<0?0:x>1?1:x;
const cv=x=>{x=cl(x);x+=a*(sm(x)-x);x=toe+x*(1-toe);x=x<=knee?x:knee+(1-knee)*Math.tanh((x-knee)/(1-knee));return(x-.5)*cf+.5};
let gs=null;if(p.grain>0){const R=rng(seed|0),cell=Math.max(1,p.gsize*md/700),gw=Math.ceil(w/cell)+2,gh=Math.ceil(h/cell)+2;
const F=[0,1,2,3].map(()=>{const f=new Float32Array(gw*gh);for(let i=0;i<f.length;i++)f[i]=(R()+R()+R()-1.5)*2;return f});gs={R,cell,gw,F}}
const smp=(f,x,y)=>{const fx=x/gs.cell,fy=y/gs.cell,ix=fx|0,iy=fy|0,tx=fx-ix,ty=fy-iy,i=iy*gs.gw+ix,g=gs.gw;return f[i]*(1-tx)*(1-ty)+f[i+1]*tx*(1-ty)+f[i+g]*(1-tx)*ty+f[i+g+1]*tx*ty};
const B16=bits===16,out=B16?new Uint16Array(n*4):new Uint8ClampedArray(n*4),ga=p.grain*.18,rf=.5*p.grough;
for(let i=0;i<n;i++){const j=i*4,kk=i*3;
let r=enc(lin[kk]),g=enc(lin[kk+1]),b=enc(lin[kk+2]);
let r2=M[0]*r+M[1]*g+M[2]*b,g2=M[3]*r+M[4]*g+M[5]*b,b2=M[6]*r+M[7]*g+M[8]*b;

r+=k*(pr.sh[0]*ws+pr.hi[0]*hw)+dd;g+=k*(pr.sh[1]*ws+pr.hi[1]*hw)+dd;b+=k*(pr.sh[2]*ws+pr.hi[2]*hw)+dd;

if(q>0){const t=.6*q;r=cl(r);g=cl(g);b=cl(b);r+=t*(sm(r)-r);g+=t*(sm(g)-g);b+=t*(sm(b)-b);
r=.012*q+r*(1-.04*q);g=.012*q+g*(1-.04*q);b=.012*q+b*(1-.04*q);
r+=q*(.012*hw-.01*ws);b+=q*(.012*ws-.01*hw);l=.2126*r+.7152*g+.0722*b;const s2=1-.1*q;r=l+(r-l)*s2;g=l+(g-l)*s2;b=l+(b-l)*s2}

const CT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let i=0;i<8;i++)c=c&1?0xEDB88320^c>>>1:c>>>1;t[n]=c>>>0}return t})();

/* ===== Ruta de película (Vision3 250D → 2383, APROXIMADA). Datos PROVISIONALES de diseño: no son mediciones de Kodak ===== */
const lg=(dmin,dr,g,a,xc,x0,x1)=>{const k=4*g/dr,q=[];for(let i=0;i<=200;i++){const x=x0+(x1-x0)*i/200,u=x-a*Math.log(1+Math.exp(4*x))/4;q.push([+x.toFixed(4),dmin+dr/(1+Math.exp(-k*(u-xc)))])}return q};

let FD={schema:1,provisional:true,note:'PROVISIONAL: curvas logísticas y matrices de diseño. Sustituir por datos digitalizados de H-1-5207 y H-1-2383.',
neg:{name:'Vision3 250D (aprox.)',pts:[NEGC,NEGC,NEGC]},prt:{name:'2383 (aprox.)',pts:[PRTC,PRTC,PRTC]},
mixExp:[[.9,.08,.02],[.05,.9,.05],[.02,.1,.88]],dyeNeg:[[1,.04,.01],[.07,1,.03],[.02,.1,1]],dyePrt:[[1,.05,.01],[.08,1,.04],[.02,.12,1]],

 const cases=[{mode:'film',dataset:'kodak',fgr:0},{mode:'film',dataset:'legacy',fgr:.5}];if(det.floatRT)cases.push({mode:'film',dataset:'kodak',fgr:0,fha:.5,fhth:.2,fhrad:.1});
 for(const p of cases){const a=REA.process(s,w,h,p,1,16),b=proc.process(s,w,h,p,1,{floatRT:det.floatRT}).out;let m=0;for(let i=0;i<a.length;i++)m=Math.max(m,Math.abs(a[i]-b[i]));if(!(m<=24))return{ok:false,reason:'diferencia '+m+' códigos en la autoprueba'}}return{ok:true}}
return{detect,supports,estimate,createProcessor,createAuto,selfTest}})();

async function toPixels(f,max){const bm=await createImageBitmap(f),s=max?Math.min(1,max/Math.max(bm.width,bm.height)):1,w=Math.max(1,Math.round(bm.width*s)),h=Math.max(1,Math.round(bm.height*s)),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(bm,0,0,w,h);return{w,h,data:x.getImageData(0,0,w,h).data}}
function show(s){S=s;$('#empty').style.display='none';const st=$('#stage');st.style.display='block';st.style.setProperty('--ar',s.w/s.h);$('#cmp').style.display='flex';
for(const id of['A','B']){const c=$('#'+id);c.width=s.w;c.height=s.h}
$('#B').getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(s.data),s.w,s.h),0,0);$('#exp').disabled=!files.length;$('#bat').disabled=!files.length;sched()}
let AUTO=null;const engine=()=>$('#eng').value==='gpu'?AUTO:null;
function process8(data,w,h,params,seed){const A=engine();return A?A.process(data,w,h,params,seed,{bits:8,reuseSource:true}):{out:REA.process(data,w,h,params,seed),engine:'cpu'}}   /* vista previa de 8 bits con el motor elegido; la GPU cae a CPU sola si no puede */
let lastGen=false;function draw(){raf=0;if(!S)return;const t=performance.now(),cmv=$('#cmpm').value,gen=P.mode==='film'&&(cmv==='gen'||cmv==='leg'),r=process8(S.data,S.w,S.h,P,7);if(r.engine==='error'){say(r.error);return}$('#A').getContext('2d').putImageData(new ImageData(r.out,S.w,S.h),0,0);
if(gen||lastGen){$('#B').getContext('2d').putImageData(new ImageData(gen?REA.process(S.data,S.w,S.h,cmv==='leg'?{...P,dataset:'legacy'}:{...P,mode:'generic'},7):new Uint8ClampedArray(S.data),S.w,S.h),0,0);lastGen=gen;$('#tb').textContent=gen?(cmv==='leg'?'Datos anteriores':'Genérico'):'Antes'}$('#ms').textContent=` Vista previa: ${Math.round(performance.now()-t)} ms · motor: ${r.engine}${$('#eng').value==='gpu'&&r.engine==='cpu'&&r.motivo?' (alternativa CPU: '+r.motivo+')':''}`}

async function load(list){const l=[...list].filter(f=>f.type.startsWith('image/'));if(!l.length)return say('Selecciona archivos de imagen (JPEG, PNG, WebP).');
try{files=l;cur=0;say(`Cargando ${l.length} imagen(es)…`);show(await toPixels(l[0],1100));say(l.length>1?`${l.length} fotos cargadas; la vista previa usa la primera. «Exportar lote» aplica los ajustes a todas.`:l[0].name)}catch(e){say('No se pudo leer la imagen. Prueba con otro archivo.')}}

x.fillStyle='#2a2f36';for(let i=0;i<9;i++){const bw=70+i*9%50,bh=120+(i*53)%140;x.fillRect(i*125+10,h*.6-bh,bw,bh)}
x.fillStyle='#fff6dc';[[180,330],[470,300],[790,350],[950,310]].forEach(([a,b])=>{x.beginPath();x.arc(a,b,9,0,7);x.fill()});x.fillStyle='#c4453a';x.fillRect(300,520,160,70);x.fillStyle='#e8c26a';x.fillRect(620,540,120,50);
files=[];show({w,h,data:x.getImageData(0,0,w,h).data});say('Imagen de muestra sintética: las luces puntuales sirven para ver Halación y Bloom.')};
async function render(f,max){const s=await toPixels(f,max),fm=$('#fmt').value,icc=$('#icc').checked?REA.iccSRGB():null,seed=7,A=engine(),o=A?(()=>{const r=A.process(s.data,s.w,s.h,P,seed);if(r.engine==='error')throw new Error(r.error);return r.out})():REA.process(s.data,s.w,s.h,P,seed,16);

async function save(data,name){let d=null;try{d=window.claude?await window.claude.use('downloads'):null}catch(e){}
if(d&&/\.tiff?$/i.test(name)){data=REA.zip([{name,data:new Uint8Array(await data.arrayBuffer())}]);name+='.zip'}
if(d){try{await d.save({filename:name,data});say(`Guardado: ${name}`)}catch(e){say(e&&e.code==='declined'?'Descarga cancelada.':'No se pudo guardar el archivo.')}return}
const a=document.createElement('a');a.href=URL.createObjectURL(data);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4e3)}
